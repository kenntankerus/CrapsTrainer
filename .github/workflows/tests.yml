# Runs the web server's tests on pull requests and on pushes to main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Install
        run: pip install -r requirements-web.txt pytest httpx
      - name: Test
        run: python -m pytest tests -q
